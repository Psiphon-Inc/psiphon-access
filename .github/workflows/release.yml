# Build and verify before any publication. Tags and protections stay human-controlled.
name: release
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full candidate source SHA
        required: true
        type: string
      tooling_sha:
        description: Full workflow and tooling SHA
        required: true
        type: string
      version:
        description: Release version without v
        required: true
        type: string
      reset_existing:
        description: Explicit prelaunch .2 reset after human tag move and protection restoration
        required: true
        default: false
        type: boolean
      expected_baseline:
        description: Exact old identities, candidate SHAs, protection fingerprint and local snapshot SHA256 (JSON)
        required: false
        type: string
      recovery_confirmation:
        description: local-snapshot-sha256:<snapshot SHA256>
        required: false
        type: string
permissions: {}
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  identity:
    if: github.event_name == 'workflow_dispatch' || github.ref_name != 'v19.0.0-psiphon.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.identity.outputs.source }}
      tooling: ${{ steps.identity.outputs.tooling }}
      version: ${{ steps.identity.outputs.version }}
    steps:
    - id: identity
      env:
        EVENT: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        EVENT_SHA: ${{ github.sha }}
        SOURCE_INPUT: ${{ inputs.source_sha }}
        TOOLING_INPUT: ${{ inputs.tooling_sha }}
        VERSION_INPUT: ${{ inputs.version }}
        RESET: ${{ inputs.reset_existing }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$EVENT" == push ]]; then
          [[ "$REF_TYPE" == tag && "$REF_NAME" != v19.0.0-psiphon.2 ]]
          source=$EVENT_SHA; tooling=$EVENT_SHA; version=${REF_NAME#v}
        else
          source=$SOURCE_INPUT; tooling=$TOOLING_INPUT; version=$VERSION_INPUT
          [[ "$RESET" != true || "$version" == 19.0.0-psiphon.2 ]]
          [[ "$version" != 19.0.0-psiphon.2 || "$RESET" == true ]]
        fi
        [[ "$source" =~ ^[0-9a-f]{40}$ && "$source" == "$tooling" && "$tooling" == "$EVENT_SHA" ]]
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-psiphon\.[0-9]+$ ]]
        printf 'source=%s\ntooling=%s\nversion=%s\n' "$source" "$tooling" "$version" >> "$GITHUB_OUTPUT"
  stage:
    needs: identity
    permissions:
      contents: read
    uses: ./.github/workflows/release-arm64.yml
    with:
      source_sha: ${{ needs.identity.outputs.source }}
      tooling_sha: ${{ needs.identity.outputs.tooling }}
      version: ${{ needs.identity.outputs.version }}
  publish:
    needs:
    - identity
    - stage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.identity.outputs.version }}
      GITREF: ${{ needs.identity.outputs.source }}
      TOOLING_SHA: ${{ needs.identity.outputs.tooling }}
      RESET_EXISTING: ${{ inputs.reset_existing && 'true' || 'false' }}
      EXPECTED_BASELINE: ${{ inputs.expected_baseline }}
      RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation }}
      SOURCE_DIR: ${{ github.workspace }}/source
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.identity.outputs.tooling }}
        path: tooling
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.identity.outputs.source }}
        path: source
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-candidate
        path: ${{ runner.temp }}/candidate
    - name: Verify all publication preconditions without writes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DOCKER_CONFIG: ${{ runner.temp }}/release-docker
        HELM_REGISTRY_CONFIG: ${{ runner.temp }}/release-helm/registry.json
      run: bash tooling/tool/teleport-google/release/publish-charts.sh --preflight "$RUNNER_TEMP/candidate"
    - name: Publish the verified candidate and check consumer identities
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DOCKER_CONFIG: ${{ runner.temp }}/release-docker
        HELM_REGISTRY_CONFIG: ${{ runner.temp }}/release-helm/registry.json
      run: bash tooling/tool/teleport-google/release/publish-charts.sh --publish "$RUNNER_TEMP/candidate"
    - name: Upload final public identity evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: published-identities
        path: ${{ runner.temp }}/published-identities.json
        if-no-files-found: error
        retention-days: 30
    - name: Remove outputs and scoped credentials
      if: always()
      run: rm -rf "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/release-docker" "$RUNNER_TEMP/release-helm" "$RUNNER_TEMP/published-identities.json"
